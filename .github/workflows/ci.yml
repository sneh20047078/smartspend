name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    name: Backend Tests (Python 3.12)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run Pytest test suite
        run: python -m pytest -v

  frontend:
    name: Frontend Tests & Build (Node 20)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run Vitest unit & integration tests
        run: npm test -- --run

      - name: Build production bundle
        run: npm run build

  infrastructure:
    name: CloudFormation & SAM Validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install SAM CLI & cfn-lint
        run: |
          python -m pip install --upgrade pip
          pip install aws-sam-cli cfn-lint

      - name: Run cfn-lint on SAM and CloudFront templates
        run: |
          cfn-lint infrastructure/template.yaml
          cfn-lint infrastructure/frontend-hosting.yaml

      - name: Validate SAM template
        run: sam validate --lint --template-file infrastructure/template.yaml
