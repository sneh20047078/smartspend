[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "smartspend-api"
version = "0.1.0"
description = "SmartSpend API and AWS Lambda handlers"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1",
  "mangum>=0.19,<1",
  "pydantic[email]>=2.10,<3",
  "pydantic-settings>=2.7,<3",
  "PyJWT[crypto]>=2.10,<3",
  "uvicorn[standard]>=0.34,<1",
  "boto3>=1.35,<2",
]

[project.optional-dependencies]
dev = ["httpx>=0.28,<1", "pytest>=8.3,<9", "pytest-cov>=6,<7", "PyYAML>=6,<7"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-ra"

[tool.setuptools.packages.find]
include = ["app*"]
