AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: SmartSpend authenticated finance API with owner-scoped DynamoDB persistence.

Parameters:
  WebOrigin:
    Type: String
    Description: HTTPS origin of the deployed frontend; local HTTP origins are not accepted.
    AllowedPattern: '^https://[A-Za-z0-9.-]+(:[0-9]{1,5})?$'
    ConstraintDescription: Provide one HTTPS origin without a path, query, or trailing slash.
  ApiStageName:
    Type: String
    Default: v1

Globals:
  Function:
    Runtime: python3.12
    Timeout: 30
    MemorySize: 512
    Tracing: Active
    Environment:
      Variables:
        APP_ENV: aws
        SMARTSPEND_AWS_REGION: !Ref AWS::Region
        COGNITO_USER_POOL_ID: !Ref SmartSpendUserPool
        COGNITO_APP_CLIENT_ID: !Ref SmartSpendUserPoolClient
        PROFILE_TABLE: !Ref ProfilesTable
        TRANSACTIONS_TABLE: !Ref TransactionsTable
        BUDGETS_TABLE: !Ref BudgetsTable
        IDEMPOTENCY_TABLE: !Ref IdempotencyTable
        GROUPS_TABLE: !Ref GroupsTable
        SHARED_EXPENSES_TABLE: !Ref SharedExpensesTable
        RECURRING_SCHEDULES_TABLE: !Ref RecurringSchedulesTable
        API_CORS_ORIGINS: !Ref WebOrigin
    LoggingConfig:
      LogFormat: JSON
      ApplicationLogLevel: INFO
      SystemLogLevel: WARN

Resources:
  ApiAccessLogGroup:
    Type: AWS::Logs::LogGroup
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      LogGroupName: !Sub /aws/http-api/smartspend-${AWS::StackName}
      RetentionInDays: 30

  LambdaLogGroup:
    Type: AWS::Logs::LogGroup
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      LogGroupName: !Sub /aws/lambda/${ProfileFunction}
      RetentionInDays: 30

  SmartSpendApi:
    Type: AWS::Serverless::HttpApi
    Properties:
      StageName: !Ref ApiStageName
      AccessLogSettings:
        DestinationArn: !GetAtt ApiAccessLogGroup.Arn
        Format: '{"requestId":"$context.requestId","routeKey":"$context.routeKey","status":"$context.status"}'
      DefaultRouteSettings:
        ThrottlingBurstLimit: 100
        ThrottlingRateLimit: 50
      FailOnWarnings: true
      CorsConfiguration:
        AllowOrigins: [!Ref WebOrigin]
        AllowHeaders: [Authorization, Content-Type, Idempotency-Key, X-Request-ID]
        AllowMethods: [GET, POST, PATCH, DELETE, OPTIONS]
        MaxAge: 600
      Auth:
        DefaultAuthorizer: CognitoJwtAuthorizer
        Authorizers:
          CognitoJwtAuthorizer:
            IdentitySource: $request.header.Authorization
            JwtConfiguration:
              issuer: !Sub https://cognito-idp.${AWS::Region}.amazonaws.com/${SmartSpendUserPool}
              audience: [!Ref SmartSpendUserPoolClient]

  SmartSpendUserPool:
    Type: AWS::Cognito::UserPool
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      UserPoolName: !Sub smartspend-${AWS::StackName}
      UsernameAttributes: [email]
      AutoVerifiedAttributes: [email]
      Policies:
        PasswordPolicy:
          MinimumLength: 12
          RequireLowercase: true
          RequireNumbers: true
          RequireSymbols: true
          RequireUppercase: true
          TemporaryPasswordValidityDays: 3
      AccountRecoverySetting:
        RecoveryMechanisms:
          - Name: verified_email
            Priority: 1
      Schema:
        - Name: email
          Required: true
          Mutable: true
        - Name: name
          Required: false
          Mutable: true

  SmartSpendUserPoolClient:
    Type: AWS::Cognito::UserPoolClient
    Properties:
      UserPoolId: !Ref SmartSpendUserPool
      ClientName: !Sub smartspend-web-${AWS::StackName}
      GenerateSecret: false
      PreventUserExistenceErrors: ENABLED
      ExplicitAuthFlows:
        - ALLOW_USER_SRP_AUTH
        - ALLOW_USER_PASSWORD_AUTH
        - ALLOW_REFRESH_TOKEN_AUTH
      SupportedIdentityProviders: [COGNITO]
      ReadAttributes: [email, name, email_verified]
      WriteAttributes: [email, name]
      AccessTokenValidity: 60
      IdTokenValidity: 60
      RefreshTokenValidity: 30
      TokenValidityUnits:
        AccessToken: minutes
        IdToken: minutes
        RefreshToken: days

  ProfilesTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      TableName: !Sub smartspend-profiles-${AWS::StackName}
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: subject
          AttributeType: S
      KeySchema:
        - AttributeName: subject
          KeyType: HASH
      SSESpecification:
        SSEEnabled: true
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true

  TransactionsTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      TableName: !Sub smartspend-transactions-${AWS::StackName}
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: owner_id
          AttributeType: S
        - AttributeName: transaction_id
          AttributeType: S
        - AttributeName: occurred_sort_key
          AttributeType: S
      KeySchema:
        - AttributeName: owner_id
          KeyType: HASH
        - AttributeName: transaction_id
          KeyType: RANGE
      GlobalSecondaryIndexes:
        - IndexName: OwnerOccurredAtIndex
          KeySchema:
            - AttributeName: owner_id
              KeyType: HASH
            - AttributeName: occurred_sort_key
              KeyType: RANGE
          Projection:
            ProjectionType: ALL
      SSESpecification:
        SSEEnabled: true
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true

  BudgetsTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      TableName: !Sub smartspend-budgets-${AWS::StackName}
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: owner_id
          AttributeType: S
        - AttributeName: budget_id
          AttributeType: S
      KeySchema:
        - AttributeName: owner_id
          KeyType: HASH
        - AttributeName: budget_id
          KeyType: RANGE
      SSESpecification:
        SSEEnabled: true
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true

  IdempotencyTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Delete
    UpdateReplacePolicy: Delete
    Properties:
      TableName: !Sub smartspend-idempotency-${AWS::StackName}
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: owner_operation
          AttributeType: S
        - AttributeName: idempotency_key
          AttributeType: S
      KeySchema:
        - AttributeName: owner_operation
          KeyType: HASH
        - AttributeName: idempotency_key
          KeyType: RANGE
      TimeToLiveSpecification:
        AttributeName: expires_at
        Enabled: true
      SSESpecification:
        SSEEnabled: true

  GroupsTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      TableName: !Sub smartspend-groups-${AWS::StackName}
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: owner_id
          AttributeType: S
        - AttributeName: group_id
          AttributeType: S
      KeySchema:
        - AttributeName: owner_id
          KeyType: HASH
        - AttributeName: group_id
          KeyType: RANGE
      SSESpecification:
        SSEEnabled: true
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true

  SharedExpensesTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      TableName: !Sub smartspend-shared-expenses-${AWS::StackName}
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: owner_id
          AttributeType: S
        - AttributeName: group_sort_key
          AttributeType: S
      KeySchema:
        - AttributeName: owner_id
          KeyType: HASH
        - AttributeName: group_sort_key
          KeyType: RANGE
      SSESpecification:
        SSEEnabled: true
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true

  RecurringSchedulesTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      TableName: !Sub smartspend-recurring-schedules-${AWS::StackName}
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: owner_id
          AttributeType: S
        - AttributeName: schedule_id
          AttributeType: S
      KeySchema:
        - AttributeName: owner_id
          KeyType: HASH
        - AttributeName: schedule_id
          KeyType: RANGE
      SSESpecification:
        SSEEnabled: true
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true

  ProfileFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: ../backend/
      Handler: app.main.lambda_handler
      Policies:
        - PolicyName: SmartSpendDataLeastPrivilege
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - dynamodb:GetItem
                  - dynamodb:PutItem
                  - dynamodb:UpdateItem
                Resource: !GetAtt ProfilesTable.Arn
              - Effect: Allow
                Action:
                  - dynamodb:GetItem
                  - dynamodb:PutItem
                  - dynamodb:UpdateItem
                  - dynamodb:DeleteItem
                  - dynamodb:Query
                Resource:
                  - !GetAtt TransactionsTable.Arn
                  - !Sub '${TransactionsTable.Arn}/index/*'
                  - !GetAtt BudgetsTable.Arn
              - Effect: Allow
                Action:
                  - dynamodb:GetItem
                  - dynamodb:PutItem
                  - dynamodb:UpdateItem
                  - dynamodb:DeleteItem
                  - dynamodb:Query
                  - dynamodb:ConditionCheckItem
                Resource:
                  - !GetAtt GroupsTable.Arn
                  - !GetAtt SharedExpensesTable.Arn
                  - !GetAtt RecurringSchedulesTable.Arn
              - Effect: Allow
                Action:
                  - dynamodb:BatchWriteItem
                Resource: !GetAtt SharedExpensesTable.Arn
              - Effect: Allow
                Action:
                  - dynamodb:GetItem
                Resource: !GetAtt IdempotencyTable.Arn
              - Effect: Allow
                Action:
                  - dynamodb:TransactWriteItems
                Resource:
                  - !GetAtt TransactionsTable.Arn
                  - !GetAtt BudgetsTable.Arn
                  - !GetAtt GroupsTable.Arn
                  - !GetAtt SharedExpensesTable.Arn
                  - !GetAtt RecurringSchedulesTable.Arn
                  - !GetAtt IdempotencyTable.Arn
      Events:
        PublicHealth:
          Type: HttpApi
          Properties:
            ApiId: !Ref SmartSpendApi
            Path: /health
            Method: GET
            Auth:
              Authorizer: NONE
        Logout:
          Type: HttpApi
          Properties:
            ApiId: !Ref SmartSpendApi
            Path: /auth/logout
            Method: POST
        ReadProfile:
          Type: HttpApi
          Properties:
            ApiId: !Ref SmartSpendApi
            Path: /me
            Method: GET
        UpdateProfile:
          Type: HttpApi
          Properties:
            ApiId: !Ref SmartSpendApi
            Path: /me
            Method: PATCH
        CreateTransaction:
          Type: HttpApi
          Properties:
            ApiId: !Ref SmartSpendApi
            Path: /transactions
            Method: POST
        ListTransactions:
          Type: HttpApi
          Properties:
            ApiId: !Ref SmartSpendApi
            Path: /transactions
            Method: GET
        ReadTransaction:
          Type: HttpApi
          Properties:
            ApiId: !Ref SmartSpendApi
            Path: /transactions/{transaction_id}
            Method: GET
        UpdateTransaction:
          Type: HttpApi
          Properties:
            ApiId: !Ref SmartSpendApi
            Path: /transactions/{transaction_id}
            Method: PATCH
        DeleteTransaction:
          Type: HttpApi
          Properties:
            ApiId: !Ref SmartSpendApi
            Path: /transactions/{transaction_id}
            Method: DELETE
        Dashboard:
          Type: HttpApi
          Properties:
            ApiId: !Ref SmartSpendApi
            Path: /dashboard
            Method: GET
        CreateBudget:
          Type: HttpApi
          Properties:
            ApiId: !Ref SmartSpendApi
            Path: /budgets
            Method: POST
        ListBudgets:
          Type: HttpApi
          Properties:
            ApiId: !Ref SmartSpendApi
            Path: /budgets
            Method: GET
        ReadBudget:
          Type: HttpApi
          Properties:
            ApiId: !Ref SmartSpendApi
            Path: /budgets/{budget_id}
            Method: GET
        UpdateBudget:
          Type: HttpApi
          Properties:
            ApiId: !Ref SmartSpendApi
            Path: /budgets/{budget_id}
            Method: PATCH
        DeleteBudget:
          Type: HttpApi
          Properties:
            ApiId: !Ref SmartSpendApi
            Path: /budgets/{budget_id}
            Method: DELETE
        CreateGroup:
          Type: HttpApi
          Properties:
            ApiId: !Ref SmartSpendApi
            Path: /groups
            Method: POST
        ListGroups:
          Type: HttpApi
          Properties:
            ApiId: !Ref SmartSpendApi
            Path: /groups
            Method: GET
        ReadGroup:
          Type: HttpApi
          Properties:
            ApiId: !Ref SmartSpendApi
            Path: /groups/{group_id}
            Method: GET
        UpdateGroup:
          Type: HttpApi
          Properties:
            ApiId: !Ref SmartSpendApi
            Path: /groups/{group_id}
            Method: PATCH
        DeleteGroup:
          Type: HttpApi
          Properties:
            ApiId: !Ref SmartSpendApi
            Path: /groups/{group_id}
            Method: DELETE
        CreateGroupExpense:
          Type: HttpApi
          Properties:
            ApiId: !Ref SmartSpendApi
            Path: /groups/{group_id}/expenses
            Method: POST
        ListGroupExpenses:
          Type: HttpApi
          Properties:
            ApiId: !Ref SmartSpendApi
            Path: /groups/{group_id}/expenses
            Method: GET
        GroupSettlements:
          Type: HttpApi
          Properties:
            ApiId: !Ref SmartSpendApi
            Path: /groups/{group_id}/settlements
            Method: GET
        CreateRecurrence:
          Type: HttpApi
          Properties:
            ApiId: !Ref SmartSpendApi
            Path: /recurrences
            Method: POST
        ListRecurrences:
          Type: HttpApi
          Properties:
            ApiId: !Ref SmartSpendApi
            Path: /recurrences
            Method: GET
        ProcessDueRecurrences:
          Type: HttpApi
          Properties:
            ApiId: !Ref SmartSpendApi
            Path: /recurrences/process-due
            Method: POST
        UpdateRecurrence:
          Type: HttpApi
          Properties:
            ApiId: !Ref SmartSpendApi
            Path: /recurrences/{schedule_id}
            Method: PATCH
        DeleteRecurrence:
          Type: HttpApi
          Properties:
            ApiId: !Ref SmartSpendApi
            Path: /recurrences/{schedule_id}
            Method: DELETE

Outputs:
  ApiBaseUrl:
    Description: SmartSpend API base URL
    Value: !Sub https://${SmartSpendApi}.execute-api.${AWS::Region}.${AWS::URLSuffix}/${ApiStageName}
  CognitoUserPoolId:
    Value: !Ref SmartSpendUserPool
  CognitoUserPoolClientId:
    Value: !Ref SmartSpendUserPoolClient
  ProfileTableName:
    Value: !Ref ProfilesTable
  TransactionsTableName:
    Value: !Ref TransactionsTable
  BudgetsTableName:
    Value: !Ref BudgetsTable
  IdempotencyTableName:
    Value: !Ref IdempotencyTable
  GroupsTableName:
    Value: !Ref GroupsTable
  SharedExpensesTableName:
    Value: !Ref SharedExpensesTable
  RecurringSchedulesTableName:
    Value: !Ref RecurringSchedulesTable
